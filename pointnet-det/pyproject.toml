[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnd"
version = "0.1.0"
description = "PointNet-based LiDAR 3D detection with deterministic canonicalisation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "numba>=0.59", "pyyaml>=6.0", "tqdm>=4.66", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
